name: Operator Example
on: workflow_dispatch
jobs:
  operator:
    runs-on: ubuntu-latest
    steps:
      #1. 논리 연산 (logical operators)
      - name: Logical Operators
        run: |
          echo "AND: ${{ true && false }}"
          echo "OR: ${{ true || false }}"
          echo "NOT: ${{ !true }}"

      #2. 비교 연산 (Comparison operators)
      - name: Comparison Operators
        run: |
          echo "Equal: ${{ 10 == 10 }}"
          echo "Not Equal: ${{ 10 != 10 }}"
          echo "Greater: ${{ 10 > 5 }}"
          echo "Less: ${{ 10 < 5 }}"
          echo "Greater Equal: ${{ 10 >= 10 }}"
          echo "Less Equal: ${{ 10 <= 10 }}"
          echo "Type Error: ${{ false ==1 }}"

      #3. 그룹핑 (Grouping)
      - name: Grouping
        run: |
          echo "Group 1: ${{ (true || false) && false }}"
          echo "Group 2: ${{ true || (false && false) }}"
          echo "Group 3: ${{ (10 > 5) && (20 > 10) }}" 
